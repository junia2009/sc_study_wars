<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>SC STUDY WARS 〜障害報告書は書きたくない〜</title>
  <meta name="description" content="情報漏洩の手口を、遊びながら見抜けるようになるドット絵の横スクロールアクション。">
  <meta name="theme-color" content="#0b0f24">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <div id="stage-wrap">
      <canvas id="screen" width="640" height="360" aria-label="ゲーム画面"></canvas>
      <div id="hud" aria-live="off">
        <span id="hud-clock">9:30</span>
        <span class="gauges">
          <span class="gauge leak" title="漏洩リスク(満タンで障害報告書)">
            <span class="label">漏洩</span><span id="hud-leak" class="bar" role="meter" aria-label="漏洩リスク"><i></i></span>
          </span>
          <span class="gauge delay" title="業務の遅れ(満タンで始末書)">
            <span class="label">遅れ</span><span id="hud-delay" class="bar" role="meter" aria-label="業務の遅れ"><i></i></span>
          </span>
        </span>
        <span id="hud-clues" class="clues" aria-label="手に入れた手がかり"></span>
        <button id="hud-pause" type="button" aria-label="一時停止"><i></i><i></i></button>
      </div>
      <div id="banner" role="status" aria-live="polite"></div>
      <div id="prompt" hidden></div>
    </div>

    <!-- スマホ用のコントローラー。押せるのはボタンの上と、その周りの少しの余白だけ(見た目と押せる範囲を一致させる)。
         左右のキーの間は、指を滑らせると切り替わる -->
    <div id="pad" aria-hidden="true">
      <div class="cluster dpad" data-zone="dpad">
        <span class="key left" data-btn="left" data-show="left"><i></i></span>
        <span class="key right" data-btn="right" data-show="right"><i></i></span>
      </div>
      <div class="cluster btns" data-zone="btns">
        <span class="pad-btn act" data-btn="act" data-show="act"><b>B</b><small>手帳</small></span>
        <span class="pad-btn jump" data-btn="jump" data-show="jump"><b>A</b><small>ジャンプ</small></span>
      </div>
    </div>
  </main>

  <div id="overlay" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
